apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: shopnow-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: <your-account>.dkr.ecr.<region>.amazonaws.com/<your-username>-shopnow/frontend:latest
        ports:
        - containerPort: 80
        resources: {...}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: shopnow-demo
spec:
  selector:
    app: frontend
  ports:
  - port: 80
    targetPort: 80
